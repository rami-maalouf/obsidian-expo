plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ramimaalouf.obsidianexpo'
version = '0.1.0'

android {
  namespace "expo.modules.vault"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ViewCompat and WindowInsetsCompat for the editor's keyboard insets.
  implementation "androidx.core:core-ktx:1.17.0"
}
