# relaunches the app on a fixture vault that scripts/ci/simulator-smoke.sh registered, types into today's
# note after checking the name above it, waits for the save, types a styled heading and a code fence,
# then searches and opens another note, and goes back to today's note, so the next launch reopens it.
# the script then checks the typed lines on disk and that every other fixture file is unchanged.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
# the name is at the top of the note, which opens at its top.
- assertVisible:
    id: "note-title"
    text: "${TODAY}"
# a note opens without the keyboard; a tap in the editor, below the short note, puts the caret
# at its end.
- tapOn: "Note text"
- inputText: "Typed in the simulator."
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/after-typing
# styling and live preview change attributes, never characters, so these lines must reach the
# file exactly as typed.
- pressKey: Enter
- inputText: "## Styled heading"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- inputText: "# Inside code"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/styled
- tapOn: "More"
- tapOn: "Search"
# the native search field takes focus by itself; tapping it is only a fallback.
- tapOn:
    text: "Search notes"
    optional: true
- inputText: "callout"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- takeScreenshot: ${OUT}/search
- tapOn: "Welcome"
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 15000
- takeScreenshot: ${OUT}/welcome
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "note-title"
      text: "${TODAY}"
    timeout: 15000
