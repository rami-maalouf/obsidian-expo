# relaunches the app on a fixture vault that scripts/ci/simulator-smoke.sh registered, types into today's
# note, waits for the save, types a styled heading and a code fence, then searches and opens another
# note. the script then checks the typed lines on disk and that every other fixture file is unchanged.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 30000
- inputText: "Typed in the simulator."
- extendedWaitUntil:
    visible: "Saved locally"
    timeout: 15000
- takeScreenshot: ${OUT}/after-typing
# source styling is display-only, so these lines must reach the file exactly as typed.
- pressKey: Enter
- inputText: "## Styled heading"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- inputText: "# Inside code"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Saved locally"
    timeout: 15000
- takeScreenshot: ${OUT}/styled
- tapOn: "More"
- tapOn: "Search"
# the native search field takes focus by itself; tapping it is only a fallback.
- tapOn:
    text: "Search notes"
    optional: true
- inputText: "callout"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- takeScreenshot: ${OUT}/search
- tapOn: "Welcome"
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 15000
- takeScreenshot: ${OUT}/welcome
