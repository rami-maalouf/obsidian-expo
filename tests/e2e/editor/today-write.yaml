# relaunches the app on a fixture vault that scripts/ci/simulator-smoke.sh registered, types into today's
# note, waits for the save and for the title to lose its unsaved mark, types a styled heading and a code
# fence, then searches and opens another note. the script then checks the typed lines on disk and that
# every other fixture file is unchanged.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
- inputText: "Typed in the simulator."
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
# the title ends with "*" while edits wait for a save, and only then.
- extendedWaitUntil:
    notVisible: "${TODAY}\\*"
    timeout: 5000
- assertVisible: "${TODAY}"
- takeScreenshot: ${OUT}/after-typing
# styling and live preview change attributes, never characters, so these lines must reach the
# file exactly as typed.
- pressKey: Enter
- inputText: "## Styled heading"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- inputText: "# Inside code"
- pressKey: Enter
- inputText: "```"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/styled
- tapOn: "More"
- tapOn: "Search"
# the native search field takes focus by itself; tapping it is only a fallback.
- tapOn:
    text: "Search notes"
    optional: true
- inputText: "callout"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- takeScreenshot: ${OUT}/search
- tapOn: "Welcome"
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 15000
- takeScreenshot: ${OUT}/welcome
