# brings the app back after another app changed today's note. the editor reloads the file
# because it had no unsaved edits, so the next typing saves on top of the outside change
# instead of reporting a conflict. the smoke script checks that the file has both.
appId: com.ramimaalouf.obsidianexpo
---
- launchApp:
    stopApp: false
# the editor reports "opened" instead of "saved" if the system ended the app while it was in the background.
- extendedWaitUntil:
    visible:
      id: "note-status:(saved|opened)"
    timeout: 15000
# a note opens without the keyboard; a tap in the editor, below the short note, puts the caret
# at its end.
- tapOn: "Note text"
- inputText: " After foreground."
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/foreground
