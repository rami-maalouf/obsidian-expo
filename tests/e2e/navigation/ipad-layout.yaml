# on a wide ipad the native sidebar stays beside the note. bookmarks the open note, finds it in
# the sidebar's bookmarks, opens today again from the calendar inspector, then relaunches and
# finds the bookmark again.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 30000
- assertVisible: "vault"
- tapOn: "Bookmark this note"
- extendedWaitUntil:
    visible:
      id: "bookmark:Daily/${TODAY}.md"
    timeout: 10000
- takeScreenshot: ${OUT}/bookmarks
- tapOn: "Calendar"
- tapOn: "Today"
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 15000
- takeScreenshot: ${OUT}/calendar-today
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 30000
- assertVisible:
    id: "bookmark:Daily/${TODAY}.md"
