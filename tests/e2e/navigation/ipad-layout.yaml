# on a wide ipad the files panel stays beside the note. bookmarks the open note from the more
# menu, finds it in the panel's bookmarks, opens the calendar panel on the right, opens today
# from the toolbar, then relaunches and finds the bookmark again.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 30000
- assertVisible: "vault"
- tapOn: "More"
- tapOn: "Bookmark this note"
- extendedWaitUntil:
    visible:
      id: "bookmark:Daily/${TODAY}.md"
    timeout: 10000
- takeScreenshot: ${OUT}/bookmarks
- tapOn: "Calendar"
- extendedWaitUntil:
    visible: "Daily/${TODAY}.md"
    timeout: 10000
- takeScreenshot: ${OUT}/calendar
- tapOn: "Today|Open today's note"
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 15000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "No unsaved changes"
    timeout: 30000
- assertVisible:
    id: "bookmark:Daily/${TODAY}.md"
