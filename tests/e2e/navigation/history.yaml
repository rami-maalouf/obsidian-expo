# opens another note from search, relaunches, and checks that the app reopens that note (r11 as
# amended october 10, 2026). the bottom toolbar slides away while the note scrolls toward its end
# and comes back when it scrolls back. back and forward in that toolbar then move between the note
# and today's note. the flow ends on today's note, so the flows after it open today's note again.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
- assertVisible:
    id: "note-title"
    text: "${TODAY}"
- tapOn: "Search"
- tapOn:
    text: "Search notes"
    optional: true
- inputText: "callout"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- tapOn: "Welcome"
- extendedWaitUntil:
    visible:
      id: "note-title"
      text: "Welcome"
    timeout: 15000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
- assertVisible:
    id: "note-title"
    text: "Welcome"
- takeScreenshot: ${OUT}/history-relaunch
- swipe:
    start: 50%, 70%
    end: 50%, 30%
- extendedWaitUntil:
    notVisible: "New note"
    timeout: 5000
- takeScreenshot: ${OUT}/toolbar-hidden
# a shorter scroll back, which leaves the note below its top, brings the toolbar back.
- swipe:
    start: 50%, 40%
    end: 50%, 55%
- extendedWaitUntil:
    visible: "New note"
    timeout: 5000
- takeScreenshot: ${OUT}/toolbar-shown
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "note-title"
      text: "${TODAY}"
    timeout: 15000
- takeScreenshot: ${OUT}/history-back
- tapOn: "Forward"
- extendedWaitUntil:
    visible:
      id: "note-title"
      text: "Welcome"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "note-title"
      text: "${TODAY}"
    timeout: 15000
