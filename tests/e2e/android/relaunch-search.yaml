# a relaunch restores the vault from its kept folder permission and opens today's note again,
# then search, from the bottom toolbar, finds a note by its content and opens it. the note
# scrolls under the app bar, and the bottom toolbar slides away while the note scrolls toward its
# end and comes back when it scrolls back.
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 60000
- assertVisible: "${TODAY}"
- takeScreenshot: ${OUT}/relaunch
- tapOn: "Search"
- inputText: "callout"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 30000
- takeScreenshot: ${OUT}/search
- tapOn: "Welcome"
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 15000
- assertVisible: "Welcome"
- takeScreenshot: ${OUT}/welcome
# the app bar takes the surface color while the note is scrolled from its top.
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- assertVisible: "Welcome"
- extendedWaitUntil:
    notVisible: "New note"
    timeout: 5000
- takeScreenshot: ${OUT}/welcome-scrolled
# a shorter scroll back, which leaves the note below its top, brings the toolbar back.
- swipe:
    start: 50%, 40%
    end: 50%, 55%
- extendedWaitUntil:
    visible: "New note"
    timeout: 5000
- takeScreenshot: ${OUT}/toolbar-shown
