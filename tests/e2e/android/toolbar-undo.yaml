# the toolbar's undo is the text field's own: it takes back the bold from today-write.yaml, and
# the script checks that the line on disk is the one from before.
appId: com.ramimaalouf.obsidianexpo
---
- tapOn: "Undo"
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/toolbar-undo
- tapOn: "Hide keyboard"
