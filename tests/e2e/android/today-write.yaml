# types into today's note, waits for the save, checks the name above the text, then types a
# heading. styling adds spans and never changes characters, so the script finds the
# lines on disk exactly as typed.
appId: com.ramimaalouf.obsidianexpo
---
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
# a note opens without the keyboard; a tap below the short note puts the caret at its end.
- tapOn:
    point: "50%,85%"
- inputText: "Typed on the emulator."
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- assertVisible:
    id: "note-title"
    text: "${TODAY}"
- takeScreenshot: ${OUT}/after-typing
- pressKey: Enter
- inputText: "## Styled heading"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/styled
