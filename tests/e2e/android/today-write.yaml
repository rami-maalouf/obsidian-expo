# checks the name above today's note, types into the note, waits for the save, then types a
# heading. styling adds spans and never changes characters, so the script finds the
# lines on disk exactly as typed.
appId: com.ramimaalouf.obsidianexpo
---
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
# the name is at the top of the note, which opens at its top.
- assertVisible:
    id: "note-title"
    text: "${TODAY}"
# a note opens without the keyboard; a tap below the short note, and above the bottom toolbar,
# puts the caret at its end.
- tapOn:
    point: "50%,70%"
- inputText: "Typed on the emulator."
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/after-typing
- pressKey: Enter
- inputText: "## Styled heading"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/styled
# the editing toolbar (t17) sits on the keyboard while the text has focus. indent and task change
# the typed list line, and bold wraps the word at the caret; the script checks the line on disk.
- inputText: "- Toolbar item"
- tapOn: "Indent"
- tapOn: "Task"
- tapOn: "Bold"
- extendedWaitUntil:
    visible:
      id: "note-status:saved"
    timeout: 15000
- takeScreenshot: ${OUT}/toolbar
