# runs after the smoke script made the daily folder read-only (`@lock-daily`), so the save
# fails. the edits must stay in the journal, and the editor must say so (r3, r4).
appId: com.ramimaalouf.obsidianexpo
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "note-status:opened"
    timeout: 30000
# a note opens without the keyboard; a tap in the editor, below the short note, puts the caret
# at its end.
- tapOn: "Note text"
- inputText: " Kept as a draft."
- extendedWaitUntil:
    visible: "Not saved yet. Your edits are kept as a draft."
    timeout: 15000
- assertVisible:
    id: "note-status:error"
- takeScreenshot: ${OUT}/save-failed
- stopApp
