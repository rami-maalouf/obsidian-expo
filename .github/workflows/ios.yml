name: ios

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# a new push waits for the running job instead of cancelling it, so every finished run still
# reports its result; only the newest waiting run is kept.
#
# the app needs xcode 27, which this runner image does not offer, so the simulator build and
# smoke test run on a mac with xcode 27 instead (readme, "native tests").
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vault-core-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: select the newest stable xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path modules/vault
