name: ios

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  vault-core-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: select the newest stable xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path modules/vault

  simulator-build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: select the newest stable xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          sw_vers
          pod --version
      - run: bun install --frozen-lockfile
      - name: generate the ios project
        run: bunx expo prebuild --platform ios
        env:
          CI: 1
      - name: confirm the local vault module is autolinked
        run: grep -rl 'VaultModule' ios/Pods/Target\ Support\ Files/*/ExpoModulesProvider.swift
      - name: build for the simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
          ls build/Build/Products/Release-iphonesimulator
      - name: open today's note from a fixture vault in the simulator
        run: |
          bundle=com.ramimaalouf.obsidianexpo
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Release-iphonesimulator/*.app
          data=$(xcrun simctl get_app_container "$udid" "$bundle" data)
          mkdir -p "$data/Documents/vault"
          cp -R tests/fixtures/vault-basic/. "$data/Documents/vault/"
          xcrun simctl launch "$udid" "$bundle" -VaultTestFolder vault
          today=$(date +%Y-%m-%d)
          for _ in $(seq 1 60); do
            [ -f "$data/Documents/vault/Daily/$today.md" ] && break
            sleep 1
          done
          sleep 5
          mkdir -p smoke
          xcrun simctl io "$udid" screenshot smoke/today.png
          xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate "process == \"obsidianexpo\" AND messageType == error" > smoke/errors.log || true
          echo "--- Daily/$today.md"
          cat "$data/Documents/vault/Daily/$today.md"
          printf '# %s\n\nCreated %s ' "$today" "$today" > smoke/expected-prefix.txt
          head -c "$(wc -c < smoke/expected-prefix.txt)" "$data/Documents/vault/Daily/$today.md" | cmp - smoke/expected-prefix.txt
          # every fixture file other than the new note must be byte-identical.
          (cd tests/fixtures/vault-basic && find . -type f -exec shasum -a 256 {} + | sort -k2) > smoke/before.txt
          (cd "$data/Documents/vault" && find . -type f ! -path "./Daily/$today.md" -exec shasum -a 256 {} + | sort -k2) > smoke/after.txt
          diff smoke/before.txt smoke/after.txt
          # the app indexes the vault with fts5 in its own sqlite build.
          expected=$(cd "$data/Documents/vault" && find . -type f -name '*.md' -not -path '*/.*' | wc -l | tr -d ' ')
          for _ in $(seq 1 60); do
            db=$(ls "$data"/Library/Caches/vault-index/index-*.db 2>/dev/null | head -1 || true)
            if [ -n "$db" ]; then
              indexed=$(sqlite3 "$db" "select count(*) from notes where indexed_modified is not null" 2>/dev/null || echo 0)
              [ "$indexed" = "$expected" ] && break
            fi
            sleep 1
          done
          echo "index: $db, $indexed of $expected notes indexed"
          [ "$indexed" = "$expected" ]
          sqlite3 "$db" "select n.path from note_text join notes n on n.id = note_text.rowid where note_text match '\"callout\"*'" | tee smoke/fts.txt
          grep -qx 'Welcome.md' smoke/fts.txt
          echo "udid=$udid" >> "$GITHUB_ENV"
          echo "app_data=$data" >> "$GITHUB_ENV"
          echo "today=$today" >> "$GITHUB_ENV"
      - name: type, save, and search with maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          maestro --device "$udid" test tests/e2e/editor/today-write.yaml
          echo "--- Daily/$today.md after typing"
          cat "$app_data/Documents/vault/Daily/$today.md"
          grep -q 'Typed in the simulator.' "$app_data/Documents/vault/Daily/$today.md"
          (cd "$app_data/Documents/vault" && find . -type f ! -path "./Daily/$today.md" -exec shasum -a 256 {} + | sort -k2) > smoke/after-maestro.txt
          diff smoke/before.txt smoke/after-maestro.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: smoke
          if-no-files-found: ignore
