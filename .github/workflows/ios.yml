name: ios

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# a new push waits for the running simulator job instead of cancelling it, so every finished
# run still reports its result; only the newest waiting run is kept.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vault-core-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: select the newest stable xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path modules/vault

  simulator-build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: select the newest stable xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          sw_vers
          pod --version
      - run: bun install --frozen-lockfile
      - name: generate the ios project
        run: bunx expo prebuild --platform ios
        env:
          CI: 1
      - name: confirm the local vault module is autolinked
        run: grep -rl 'VaultModule' ios/Pods/Target\ Support\ Files/*/ExpoModulesProvider.swift
      - name: confirm the app targets iphone and ipad and rotates
        run: |
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' ios/*.xcodeproj/project.pbxproj
          plist=$(ls ios/*/Info.plist | grep -v Pods | head -1)
          plutil -extract 'UISupportedInterfaceOrientations' json -o - "$plist" | tee orientations.json
          grep -q LandscapeLeft orientations.json
          plutil -extract 'UISupportedInterfaceOrientations~ipad' json -o - "$plist" || echo "no ipad-specific orientations"
      - name: build for the simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
          ls build/Build/Products/Release-iphonesimulator
      - name: iphone smoke test with typing, saving, search, background, outside edits, recovery, and relaunch
        run: |
          scripts/ci/simulator-smoke.sh "iPhone" build/Build/Products/Release-iphonesimulator/*.app smoke/iphone \
            tests/e2e/editor/today-write.yaml tests/e2e/editor/background.yaml @external-edit \
            tests/e2e/editor/foreground.yaml @lock-daily tests/e2e/recovery/unsaved-draft.yaml @unlock-daily \
            tests/e2e/recovery/open-draft.yaml tests/e2e/daily-notes/relaunch-today.yaml
      - name: ipad smoke test with the wide layout
        run: |
          scripts/ci/simulator-smoke.sh "iPad Pro 13" build/Build/Products/Release-iphonesimulator/*.app smoke/ipad \
            tests/e2e/editor/today-write.yaml tests/e2e/navigation/ipad-layout.yaml tests/e2e/daily-notes/relaunch-today.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: smoke
          if-no-files-found: ignore
