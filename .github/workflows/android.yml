name: android

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# a new push waits for the running job instead of cancelling it, so every finished run still
# reports its result; only the newest waiting run is kept.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vault-core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: gradle test
        run: |
          java -version
          modules/vault/android/core-tests/gradlew -p modules/vault/android/core-tests test --no-daemon

  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: expo prebuild
        run: bunx expo prebuild --platform android --no-install
      - name: check the generated project
        run: |
          grep -q 'android:configChanges' android/app/src/main/AndroidManifest.xml
          grep -n 'windowSoftInputMode\|screenOrientation' android/app/src/main/AndroidManifest.xml || true
      - name: release build for the x86_64 emulator
        working-directory: android
        env:
          CI: 1
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: check that the vault module is linked
        run: grep -rl --include='*.java' --include='*.kt' 'expo.modules.vault.VaultModule' android node_modules/expo/android | head -5 | grep .
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  emulator-smoke:
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # api 35 (android 15): edge-to-edge is on, as it is for every app on recent android.
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
      # one folder for avdmanager and the emulator; in run 37896208258 the emulator did not
      # find the device that avdmanager had created.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: apk
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: start the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # yes stops with a broken pipe when sdkmanager is done; only sdkmanager's result counts.
          (yes || true) | "$tools/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force -n smoke -k "$SYSTEM_IMAGE" -d pixel_7 -p "$ANDROID_AVD_HOME/smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx smoke
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -memory 4096 > emulator.log 2>&1 &
          # an emulator that stops at once (for example, without hardware acceleration) fails here.
          sleep 15
          pgrep -f 'qemu-system|emulator -avd smoke' > /dev/null || { cat emulator.log; exit 1; }
      - name: smoke test
        run: scripts/ci/emulator-smoke.sh "$(ls apk/*.apk | head -1)" smoke/android
      - if: always()
        run: tail -40 emulator.log || true
      # small jpeg copies of the screenshots, as base64 in the log: some cloud agents can read
      # job logs but cannot download artifacts. decode a line with `base64 -d > name.jpg`.
      - name: screenshots as text
        if: always()
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user pillow
          find smoke -name '*.png' | sort | while read -r shot; do
            python3 -c 'import sys; from PIL import Image; image = Image.open(sys.argv[1]).convert("RGB"); image.thumbnail((360, 800)); image.save("thumbnail.jpg", quality=60)' "$shot"
            echo "screenshot $shot $(base64 -w0 thumbnail.jpg)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke
          retention-days: 7
